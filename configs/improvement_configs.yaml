# Configuration for YOLO v8 Improvements Testing
# This file defines hyperparameters for different improvement experiments

# Baseline Configuration (default YOLOv8)
baseline:
  model: yolov8n.pt
  data: coco128.yaml
  
  # Training settings
  epochs: 10
  batch_size: 16
  imgsz: 640
  
  # Loss
  box_loss_weight: 7.5
  cls_loss_weight: 0.5
  dfl_loss_weight: 1.5
  
  # Optimizer
  optimizer: Adam
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  
  # Augmentation (standard)
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0


# Experiment 1: Enhanced Data Augmentation
exp1_augmentation:
  _base: baseline
  
  # Enable new augmentations
  gridmask: true
  gridmask_p: 0.3
  gridmask_d_range: [96, 224]
  gridmask_ratio: 0.5
  
  cutout: true
  cutout_p: 0.3
  cutout_n_holes: 1
  cutout_length: 64
  
  random_erasing: true
  random_erasing_p: 0.3
  random_erasing_sl: 0.02
  random_erasing_sh: 0.4
  
  # Enhanced standard augmentations
  mosaic: 1.0
  mixup: 0.1
  mixup_improved: true
  mixup_max_ratio: 0.5


# Experiment 2: Improved Loss Functions
exp2_loss:
  _base: baseline
  
  # Use CIoU instead of default
  bbox_loss: ciou
  
  # Add Focal Loss for classification
  use_focal_loss: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  
  # Adjust loss weights for better balance
  box_loss_weight: 10.0
  cls_loss_weight: 0.3


# Experiment 3: Alpha-IoU Loss
exp3_alphaiou:
  _base: baseline
  
  bbox_loss: alphaiou
  alphaiou_alpha: 3.0
  
  # Alpha-IoU focuses more on hard examples
  # May need different loss weights
  box_loss_weight: 8.0


# Experiment 4: SIoU Loss
exp4_siou:
  _base: baseline
  
  bbox_loss: siou
  siou_theta: 4.0
  
  box_loss_weight: 7.5


# Experiment 5: Training Strategy Improvements
exp5_training:
  _base: baseline
  
  # Optimizer
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.01
  
  # Scheduler
  lr_scheduler: cosine
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
  # Gradient clipping
  gradient_clip: 10.0
  
  # EMA (Exponential Moving Average)
  ema: true
  ema_decay: 0.9998
  
  # Mixed precision training
  amp: true


# Experiment 6: Combined Improvements (All)
exp6_combined:
  _base: exp1_augmentation
  
  # Include improved losses
  bbox_loss: ciou
  use_focal_loss: true
  
  # Include training improvements
  optimizer: AdamW
  lr_scheduler: cosine
  ema: true
  amp: true


# Hyperparameter ranges for ablation studies
ablation_ranges:
  gridmask_p: [0.0, 0.2, 0.4, 0.6]
  cutout_length: [32, 64, 96, 128]
  focal_gamma: [1.5, 2.0, 2.5, 3.0]
  alphaiou_alpha: [2.0, 3.0, 4.0, 5.0]
  lr0: [0.001, 0.005, 0.01, 0.02]
  box_loss_weight: [5.0, 7.5, 10.0, 12.5]


# Analysis settings
analysis:
  metrics_to_track:
    - mAP50
    - mAP50-95
    - precision
    - recall
    - fps
    - latency_ms
    - peak_memory_mb
  
  compare_with_baseline: true
  
  generate_plots: true
  plot_types:
    - confusion_matrix
    - pr_curve
    - f1_curve
    - comparison_bar
  
  statistical_tests:
    - paired_t_test
    - wilcoxon_signed_rank
  
  significance_level: 0.05


# Hardware settings for testing
hardware:
  device: cuda  # or 'cpu'
  dataloader_workers: 8
  pin_memory: true
  benchmark: true  # cudnn.benchmark
  
  # For fair comparison, use same hardware
  deterministic: false
  
  # Memory optimization
  empty_cache_per_epoch: true
  gradient_accumulation_steps: 1
